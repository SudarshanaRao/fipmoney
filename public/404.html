<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | FipMoney</title>
  <link rel="icon" type="image/png" href="/fipmoney_favicon_tight.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      background: #090d16;
      background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: rgba(216, 146, 33, 0.18);
      filter: blur(100px);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 10;
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 48px 32px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(216, 146, 33, 0.12);
      border: 1px solid rgba(216, 146, 33, 0.3);
      color: #fbbf24;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
    }
    .logo-img { height: 18px; object-fit: contain; }
    .error-code {
      font-size: 84px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d89221 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      text-shadow: 0 10px 30px rgba(216, 146, 33, 0.2);
    }
    h1 { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; font-weight: 500; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 28px;
      background: linear-gradient(135deg, #d89221 0%, #b47517 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      border-radius: 18px;
      text-decoration: none;
      box-shadow: 0 12px 28px -6px rgba(216, 146, 33, 0.45);
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px -6px rgba(216, 146, 33, 0.6);
      background: linear-gradient(135deg, #e59b24 0%, #c4811a 100%);
    }
    .footer { margin-top: 36px; font-size: 12px; color: #64748b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="logo-badge">
      <img src="/fipmoney_logo_final.png" alt="FipMoney Logo" class="logo-img" />
      <span>FipMoney Secure</span>
    </div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page or API endpoint you are trying to access does not exist or has been relocated.</p>
    <a href="/" class="btn">Return to FipMoney Home</a>
  </div>
  <div class="footer">© 2026 FipMoney. All rights reserved.</div>
</body>
</html>
