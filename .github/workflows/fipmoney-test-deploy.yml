name: Fipmoney Test Deploy

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to S3 (test.fipmoney.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-2' }}

      - name: Deploy Build Files to S3 Bucket
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME || 'fipmoney-test-frontend' }} --delete

      - name: Invalidate CloudFront Cache (Optional)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
