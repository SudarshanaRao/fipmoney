name: Deploy to AWS S3

on:
  # Allows 1-click manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Automatically triggers when code is pushed to main branch
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Deploy Build Files Directly to S3 Root
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME || 'www.fipmoney.com' }} --delete
